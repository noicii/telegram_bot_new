name: Bot V2 Tests

on:
  push:
    branches:
      - bot-vnext-upgrade
      - bot-vnext-fixed
  pull_request:
    branches:
      - bot-vnext-upgrade
      - bot-vnext-fixed
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 lxml python-dotenv

      - name: Compile Python files
        run: python -m compileall -q bot_vnext crawler.py config.py

      - name: Run bot_vnext test harness
        run: python -m unittest discover -s bot_vnext/tests -p 'test_*.py' -v
