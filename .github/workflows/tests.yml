name: Tests

on:
  push:
    branches:
      - vnext-v3
  pull_request:
    branches:
      - vnext-v3

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/bot_vnext
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f bot_vnext/requirements.txt ]; then pip install -r bot_vnext/requirements.txt; fi
          pip install pytest

      - name: Run tests
        run: python -m pytest -q bot_vnext/tests
