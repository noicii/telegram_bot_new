name: Protected Bot V2 CI

on:
  push:
    branches:
      - "bot-vnext"
      - "bot-vnext-fixed"
      - "bot-vnext-upgrade"
  pull_request:
    branches:
      - "bot-vnext"
      - "bot-vnext-fixed"
      - "bot-vnext-upgrade"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: bot_vnext

jobs:
  protected-ci:
    name: Protected Bot V2 CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify runtime patcher is removed
        run: test ! -e bot_vnext/apply_ui_runtime_patch.py

      - name: Run fail-closed release guard
        run: python tools/release_guard.py

      - name: Compile production Python
        run: |
          python -m py_compile \
            bot_vnext/main.py \
            bot_vnext/app/pipeline.py \
            bot_vnext/app/downloader/engine.py \
            bot_vnext/app/downloader/browser_hls.py \
            bot_vnext/app/queue/upload_manager.py \
            bot_vnext/app/uploader/engine.py \
            bot_vnext/app/storage/database.py \
            bot_vnext/app/core/task.py

      - name: Run core safety regression tests
        run: python -m unittest discover -s bot_vnext/tests -p 'test_*.py' -v
